name: Ticket Automation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:   # lets you trigger it manually from the Actions tab too
    inputs:
      send_summary_now:
        description: "Also email a TEST copy of today's summary right now"
        type: boolean
        default: false

concurrency:
  group: ticket-automation
  cancel-in-progress: false   # queue instead of overlap if a run is still going

permissions:
  contents: write   # needed to commit the ticket log back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create .env
        run: |
          cat > .env << EOF
          PLATFORM_URL=${{ secrets.PLATFORM_URL }}
          PLATFORM_USERNAME=${{ secrets.PLATFORM_USERNAME }}
          PLATFORM_PASSWORD=${{ secrets.PLATFORM_PASSWORD }}
          HEADLESS=true
          BROWSER_CHANNEL=
          EOF

      - name: Run ticket automation (single pass)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          DAILY_SUMMARY_TO: ${{ secrets.DAILY_SUMMARY_TO }}
          DAILY_SUMMARY_HOUR: ${{ vars.DAILY_SUMMARY_HOUR }}
          DAILY_SUMMARY_FORCE: ${{ inputs.send_summary_now }}
        run: python run_once.py

      - name: Commit ticket log
        run: |
          if [ -d logs ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add logs/
            git commit -m "Update ticket log" || echo "nothing to commit"
            git pull --rebase
            git push
          else
            echo "No logs folder yet — nothing to commit."
          fi
