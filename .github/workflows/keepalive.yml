name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days with zero repo
# activity. This makes one trivial commit a month so that never happens.

on:
  schedule:
    - cron: '0 0 1 * *'   # once a month, midnight UTC on the 1st
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat file and commit
        run: |
          date > HEARTBEAT.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HEARTBEAT.txt
          git commit -m "keepalive" || echo "nothing to commit"
          git push
